# Posts each new org discussion to the ArtisanPack UI Bluesky and Mastodon
# accounts.
#
# Org discussions live in this repository, so `discussion: created` fires
# for every new one. Release announcements are posted by the website
# plugin's GitHub webhook instead (artisanpack-ui-website-plugin).
#
# Configure on the org (Settings → Secrets and variables → Actions) or on
# this repo. A network with anything missing is skipped:
#   vars.BLUESKY_HANDLE           e.g. artisanpackui.bsky.social
#   secrets.BLUESKY_APP_PASSWORD  an app password, never the account password
#   vars.MASTODON_INSTANCE_URL    e.g. https://phpc.social
#   secrets.MASTODON_ACCESS_TOKEN a token with the write:statuses scope
#
# The repo is public, so anyone can open a discussion. Only discussions by
# the authors in ANNOUNCE_AUTHOR_ASSOCIATIONS are posted (org owners,
# members and collaborators by default), so a spammer can't make the org
# accounts post. The title is still treated as untrusted: the script reads
# the event payload from disk rather than through `${{ }}` interpolation,
# so a title can't inject shell, and it defuses `@`, `#` and URLs so a
# title can't mention anyone, join hashtags or bring its own link card.
# The post's own hashtags (HASHTAGS) go on a line above the link, with a
# `#tag` facet each on Bluesky.
#
# Each network posts from its own matrix job, so re-running a failed job
# only retries the network that failed and never posts twice to the other.
# The Bluesky post is written under a record key derived from the
# discussion, so a re-run rewrites it rather than adding a second one;
# Mastodon posts carry an Idempotency-Key (kept by Mastodon for about an
# hour). A 429 is retried up to twice within the job.
name: Announce new discussions

on:
  discussion:
    types: [created]

permissions: {}

jobs:
  announce:
    name: Post to ${{ matrix.network }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        network: [Bluesky, Mastodon]
    env:
      NETWORK: ${{ matrix.network }}
      # Author associations whose discussions are posted, comma-separated.
      # Leave empty to post every discussion.
      ANNOUNCE_AUTHOR_ASSOCIATIONS: OWNER,MEMBER,COLLABORATOR
      # Categories that are never announced, comma-separated.
      SKIP_CATEGORIES: ''
      # Hashtags added to every post, comma-separated, without the `#`.
      HASHTAGS: Laravel,OpenSource
      BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      MASTODON_INSTANCE_URL: ${{ vars.MASTODON_INSTANCE_URL }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
    steps:
      - name: Post the discussion
        run: |
          node --input-type=module <<'SCRIPT'
          import { readFileSync } from 'node:fs';

          const { discussion } = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const env = process.env;

          const list = (value) => value.split(',').map((item) => item.trim().toLowerCase()).filter(Boolean);
          const authors = list(env.ANNOUNCE_AUTHOR_ASSOCIATIONS);
          const association = (discussion.author_association ?? '').toLowerCase();

          if (authors.length > 0 && !authors.includes(association)) {
              console.log(`Skipping a discussion by an author with the "${association || 'unknown'}" association.`);
              process.exit(0);
          }

          const skip = list(env.SKIP_CATEGORIES);
          const category = discussion.category?.name ?? '';

          if (skip.includes(category.toLowerCase())) {
              console.log(`Skipping a discussion in the "${category}" category.`);
              process.exit(0);
          }

          const url = discussion.html_url;

          if (!url?.startsWith('https://github.com/')) {
              throw new Error('The discussion has no GitHub URL.');
          }

          // Defuse mentions, hashtags and links: a zero-width space after `@`
          // and `#`, and in `://`, stops Mastodon linking them.
          let title = discussion.title
              .replace(/\s+/g, ' ')
              .trim()
              .replace(/[@#]/g, '$&\u200B')
              .replaceAll('://', ':\u200B//');

          // Bluesky allows 300 graphemes for the whole post. The URL always
          // stays whole; the category is capped, and the title gets what's
          // left (at most 180).
          const LIMIT = 300;
          const segmenter = new Intl.Segmenter('en', { granularity: 'grapheme' });
          const split = (value) => [...segmenter.segment(value)].map((part) => part.segment);
          const shorten = (value, budget) => {
              const parts = split(value);
              return parts.length <= budget ? value : parts.slice(0, Math.max(0, budget - 1)).join('').trimEnd() + '…';
          };

          // Tags only: letters, digits and underscores, so one can't smuggle
          // in a link or a mention.
          const tags = env.HASHTAGS.split(',').map((tag) => tag.trim().replace(/^#/, '')).filter((tag) => /^\w+$/u.test(tag));
          const tagLine = tags.map((tag) => `#${tag}`).join(' ');
          const suffix = `${tagLine ? `\n${tagLine}` : ''}\n\n${url}`;
          const label = category ? shorten(category, 40) : '';
          const prefix = label ? `💬 New discussion in ${label}: ` : '💬 New discussion: ';
          const titleBudget = Math.min(180, LIMIT - split(prefix).length - split(suffix).length);

          if (titleBudget < 2) {
              throw new Error('The discussion URL leaves no room for a title within Bluesky\'s limit.');
          }

          title = shorten(title, titleBudget);
          const text = `${prefix}${title}${suffix}`;

          // GitHub's discussion id as a stable 10-bit number, for the record key.
          const clockId = [...discussion.node_id].reduce((hash, char) => (hash * 31 + char.charCodeAt(0)) % 1024, 7);

          // An AT Protocol TID (13 base32-sortable characters) built from the
          // discussion's creation time and id rather than the clock, so a
          // re-run writes the same Bluesky record instead of a second post.
          function recordKey() {
              const alphabet = '234567abcdefghijklmnopqrstuvwxyz';
              const micros = BigInt(Date.parse(discussion.created_at) || 0) * 1000n;
              let value = ((micros & ((1n << 53n) - 1n)) << 10n) | BigInt(clockId);
              let key = '';
              for (let index = 0; index < 13; index++) {
                  key = alphabet[Number(value & 31n)] + key;
                  value >>= 5n;
              }
              return key;
          }

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          // Seconds to wait before retrying a 429, from Retry-After (seconds),
          // Bluesky's RateLimit-Reset (Unix time) or Mastodon's
          // X-RateLimit-Reset (ISO 8601), capped at a minute.
          function retryDelay(response, attempt) {
              const retryAfter = Number(response.headers.get('retry-after'));
              const reset = response.headers.get('ratelimit-reset') ?? response.headers.get('x-ratelimit-reset');
              const resetAt = reset === null ? NaN : (/^\d+$/.test(reset) ? Number(reset) * 1000 : Date.parse(reset));
              const seconds = Number.isFinite(retryAfter) && retryAfter > 0
                  ? retryAfter
                  : (Number.isFinite(resetAt) ? (resetAt - Date.now()) / 1000 : 5 * 2 ** attempt);
              return Math.min(60, Math.max(1, Math.ceil(seconds)));
          }

          // Only a 429 is retried (at most three attempts); any other failure
          // fails the job at once.
          async function call(label, request) {
              for (let attempt = 1; ; attempt++) {
                  const response = await fetch(...request);
                  const body = await response.json().catch(() => ({}));

                  if (response.ok) {
                      return body;
                  }

                  if (response.status === 429 && attempt < 3) {
                      const delay = retryDelay(response, attempt);
                      console.log(`${label} was rate limited; retrying in ${delay}s.`);
                      await sleep(delay * 1000);
                      continue;
                  }

                  throw new Error(`${label} answered HTTP ${response.status}: ${body.message ?? body.error ?? ''}`);
              }
          }

          async function bluesky() {
              const xrpc = 'https://bsky.social/xrpc';
              const session = await call('Bluesky sign-in', [`${xrpc}/com.atproto.server.createSession`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ identifier: env.BLUESKY_HANDLE.replace(/^@/, ''), password: env.BLUESKY_APP_PASSWORD }),
              }]);

              // Bluesky doesn't link URLs or tags in post text itself: facet
              // indexes are UTF-8 byte offsets.
              const bytes = (value) => new TextEncoder().encode(value).length;
              const byteEnd = bytes(text);

              // The tags line sits right before the URL, after the (defused)
              // title, so each tag is found from that line onwards.
              function tagFacets() {
                  if (!tagLine) {
                      return [];
                  }

                  const lineStart = bytes(text.slice(0, text.lastIndexOf(tagLine)));
                  let offset = lineStart;

                  return tags.map((tag) => {
                      const facet = {
                          index: { byteStart: offset, byteEnd: offset + bytes(`#${tag}`) },
                          features: [{ $type: 'app.bsky.richtext.facet#tag', tag }],
                      };
                      offset += bytes(`#${tag} `);
                      return facet;
                  });
              }

              // putRecord under a fixed key: a re-run rewrites the same post.
              const post = await call('Bluesky post', [`${xrpc}/com.atproto.repo.putRecord`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.accessJwt}` },
                  body: JSON.stringify({
                      repo: session.did,
                      collection: 'app.bsky.feed.post',
                      rkey: recordKey(),
                      record: {
                          $type: 'app.bsky.feed.post',
                          text,
                          createdAt: new Date(Date.parse(discussion.created_at) || Date.now()).toISOString(),
                          langs: ['en'],
                          facets: [
                              {
                                  index: { byteStart: byteEnd - bytes(url), byteEnd },
                                  features: [{ $type: 'app.bsky.richtext.facet#link', uri: url }],
                              },
                              ...tagFacets(),
                          ],
                          embed: {
                              $type: 'app.bsky.embed.external',
                              external: { uri: url, title, description: 'Join the discussion on GitHub' },
                          },
                      },
                  }),
              }]);

              console.log(`Posted to Bluesky: ${post.uri}`);
          }

          async function mastodon() {
              const instance = env.MASTODON_INSTANCE_URL.replace(/\/+$/, '');
              if (!instance.startsWith('https://')) {
                  throw new Error('MASTODON_INSTANCE_URL must be an https URL.');
              }

              const status = await call('Mastodon post', [`${instance}/api/v1/statuses`, {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json',
                      Authorization: `Bearer ${env.MASTODON_ACCESS_TOKEN}`,
                      'Idempotency-Key': `artisanpack-ui-discussion-${discussion.node_id}`,
                  },
                  body: JSON.stringify({ status: text, visibility: 'public', language: 'en' }),
              }]);

              console.log(`Posted to Mastodon: ${status.url}`);
          }

          const configured = {
              Bluesky: Boolean(env.BLUESKY_HANDLE && env.BLUESKY_APP_PASSWORD),
              Mastodon: Boolean(env.MASTODON_INSTANCE_URL && env.MASTODON_ACCESS_TOKEN),
          };

          if (!configured[env.NETWORK]) {
              console.log(`::notice::${env.NETWORK} isn't configured; nothing was posted there.`);
              process.exit(0);
          }

          try {
              await (env.NETWORK === 'Bluesky' ? bluesky() : mastodon());
          } catch (error) {
              console.log(`::error::${env.NETWORK}: ${error.message}`);
              process.exit(1);
          }
          SCRIPT
